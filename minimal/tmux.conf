set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,ghostty:RGB,kitty:RGB,*256color:Tc"
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g renumber-windows on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#W"
set -g bell-action any
set -g visual-bell off
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g monitor-bell on
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind e new-window -c "#{pane_current_path}" "nvim"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 64
set -g status-right-length 256
set -g status-style "bg=default,fg=white"
set -g message-style "bg=blue,fg=black,bold"
set -g mode-style "bg=yellow,fg=black,bold"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=blue"
setw -g window-status-activity-style "default"
setw -g window-status-bell-style "default"
set -g @window-pill-normal-left "#[fg=colour8,bg=default]#[fg=white,bg=colour8]"
set -g @window-pill-normal-right "#[fg=colour8,bg=default]"
set -g @window-pill-activity-left "#[fg=green,bg=default]#[fg=black,bg=green,bold]"
set -g @window-pill-activity-right "#[fg=green,bg=default]"
set -g @window-pill-bell-left "#[fg=red,bg=default]#[fg=black,bg=red,bold]"
set -g @window-pill-bell-right "#[fg=red,bg=default]"
set -g status-left "#[fg=blue,bg=default]#[fg=black,bg=blue,bold] 󱂬 #S #[fg=blue,bg=colour8]#[fg=white,bg=colour8] 󰒋 #H #[fg=colour8,bg=default]"
set -g status-right "#{?client_prefix,#[fg=red,bg=default]#[fg=black,bg=red,bold] 󰘳 PREFIX #[fg=red,bg=default] ,}#{?pane_in_mode,#[fg=yellow,bg=default]#[fg=black,bg=yellow,bold] 󰆏 COPY #[fg=yellow,bg=default] ,}#{?window_zoomed_flag,#[fg=green,bg=default]#[fg=black,bg=green,bold] 󰁌 ZOOM #[fg=green,bg=default] ,}"
setw -g window-status-format "#{?window_bell_flag,#{@window-pill-bell-left},#{?window_activity_flag,#{@window-pill-activity-left},#{@window-pill-normal-left}}}#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,} #I #W #{?window_bell_flag,#{@window-pill-bell-right},#{?window_activity_flag,#{@window-pill-activity-right},#{@window-pill-normal-right}}}#[default]"
setw -g window-status-current-format "#[fg=yellow,bg=default]#[fg=black,bg=yellow,bold]#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,} #I #W#{?window_zoomed_flag, 󰁌,} #[fg=yellow,bg=default]#[default]"
setw -g automatic-rename on
setw -g allow-rename on
setw -g window-status-separator " "
